plugins { id 'com.android.application' }
def pilot = new groovy.json.JsonSlurper().parse(file('../../pilot-config.json'))

android {
    namespace 'com.aisecretary.sharedpilot'
    compileSdk 34
    buildFeatures { buildConfig true }
    // Plugin-owned native adapters are compiled alongside the host.
    sourceSets { main.java.srcDir '../../../../src/topic-plugins' }
    defaultConfig {
        applicationId 'com.aisecretary.sharedpilot'
        minSdk 26
        targetSdk 34
        versionCode pilot.versionCode
        versionName "${pilot.version}-pilot"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
