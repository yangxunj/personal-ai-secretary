<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语单词卡 · 动物与水果</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1a1d23; --muted:#6b7280; --line:#e5e8ee;
  --accent:#4f46e5; --accent-ink:#ffffff;
  --animal:#d97706; --animal-soft:#fef3c7;
  --fruit:#db2777; --fruit-soft:#fce7f3;
  --shadow:0 10px 28px rgba(20,25,45,.09);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --card:#181b21; --text:#e9ecf2; --muted:#98a0ae; --line:#272c34;
    --accent:#8b8cf9; --accent-ink:#10121a;
    --animal:#fbbf24; --animal-soft:#3a2c0d;
    --fruit:#f472b6; --fruit-soft:#3a1229;
    --shadow:0 10px 28px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; justify-content:center;
  padding:22px 16px calc(30px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.wrap{width:100%; max-width:460px}
h1{font-size:19px; margin:0 0 4px; letter-spacing:.2px}
.sub{color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.5}
.tabs{display:flex; gap:8px; margin-bottom:16px}
.tab{
  flex:1; min-height:46px; border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:13px; font-size:14px; font-family:inherit; cursor:pointer; transition:.15s;
}
.tab.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.barline{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.bar{flex:1; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.fill{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s}

.card{position:relative; perspective:1300px; margin-bottom:16px}
.inner{
  position:relative; height:340px; transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.inner.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  padding:30px 24px; text-align:center; overflow-y:auto;
  background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
}
.back{transform:rotateY(180deg)}
.badge{
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px;
  background:var(--animal-soft); color:var(--animal); letter-spacing:.5px;
}
.badge.fruit{background:var(--fruit-soft); color:var(--fruit)}
.word{font-size:clamp(2.1rem,13vw,3.1rem); font-weight:700; letter-spacing:.5px; line-height:1.1}
.zh{font-size:30px; font-weight:700}
.ex-en{font-size:17px; color:var(--text); line-height:1.5}
.ex-zh{font-size:14px; color:var(--muted); line-height:1.5}
.hint{font-size:13px; color:var(--muted); margin-top:6px}
.speak-ex{
  margin-top:6px; min-height:44px; padding:0 18px; border-radius:99px; cursor:pointer;
  border:1px solid var(--line); background:transparent; color:var(--text);
  font-size:14px; font-family:inherit;
}
.speaker{
  position:absolute; top:12px; right:12px; z-index:3;
  width:48px; height:48px; border-radius:50%; cursor:pointer; font-size:20px;
  border:1px solid var(--line); background:var(--card); color:var(--text);
  box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
}
.speaker:active{transform:scale(.94)}
.controls{display:flex; gap:10px}
.btn{
  flex:1; min-height:50px; border-radius:14px; cursor:pointer; font-family:inherit;
  border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn:active{transform:scale(.98)}
.tip{margin-top:14px; font-size:12px; color:var(--muted); line-height:1.6; text-align:center}
.toast{
  position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px);
  background:var(--text); color:var(--bg); font-size:14px;
  padding:10px 18px; border-radius:99px; opacity:0; pointer-events:none;
  transition:.25s; max-width:88vw; text-align:center; z-index:9;
}
.toast.show{opacity:.95; transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>英语单词卡</h1>
  <p class="sub">三年级 · 动物 10 个 + 水果 10 个。点卡片翻面看中文和例句。</p>

  <div class="tabs">
    <button class="tab on" data-filter="all">全部</button>
    <button class="tab" data-filter="animal">动物</button>
    <button class="tab" data-filter="fruit">水果</button>
  </div>

  <div class="barline">
    <span class="count" id="count">1 / 20</span>
    <span class="bar"><span class="fill" id="fill"></span></span>
  </div>

  <div class="card" id="card">
    <div class="inner" id="inner">
      <div class="face front">
        <span class="badge" id="badgeF">动物</span>
        <div class="word" id="wordF">cat</div>
        <div class="hint">点一下看中文 →</div>
      </div>
      <div class="face back">
        <span class="badge" id="badgeB">动物</span>
        <div class="zh" id="zh">猫</div>
        <div class="ex-en" id="exEn">I have a cat.</div>
        <div class="ex-zh" id="exZh">我有一只猫。</div>
        <button class="speak-ex" id="speakEx">🔊 读例句</button>
      </div>
    </div>
    <button class="speaker" id="speak" aria-label="朗读单词">🔊</button>
  </div>

  <div class="controls">
    <button class="btn" id="prev">上一张</button>
    <button class="btn" id="shuffle">打乱顺序</button>
    <button class="btn primary" id="next">下一张</button>
  </div>

  <p class="tip">🔊 用设备自带的英文朗读，音量打开就能听到。</p>
</div>
<div class="toast" id="toast"></div>

<script>
var WORDS = [
  {en:'cat',        zh:'猫',    cat:'animal', ex:'I have a cat.',              exZh:'我有一只猫。'},
  {en:'dog',        zh:'狗',    cat:'animal', ex:'The dog is very big.',       exZh:'这只狗很大。'},
  {en:'bird',       zh:'鸟',    cat:'animal', ex:'The bird can fly.',          exZh:'鸟会飞。'},
  {en:'fish',       zh:'鱼',    cat:'animal', ex:'The fish is in the water.',   exZh:'鱼在水里。'},
  {en:'rabbit',     zh:'兔子',  cat:'animal', ex:'The rabbit is white.',       exZh:'这只兔子是白色的。'},
  {en:'monkey',     zh:'猴子',  cat:'animal', ex:'The monkey likes bananas.',  exZh:'猴子喜欢香蕉。'},
  {en:'elephant',   zh:'大象',  cat:'animal', ex:'The elephant has a long nose.', exZh:'大象有长长的鼻子。'},
  {en:'panda',      zh:'熊猫',  cat:'animal', ex:'The panda is black and white.', exZh:'熊猫是黑白两色的。'},
  {en:'tiger',      zh:'老虎',  cat:'animal', ex:'The tiger is strong.',       exZh:'老虎很强壮。'},
  {en:'duck',       zh:'鸭子',  cat:'animal', ex:'The duck can swim.',         exZh:'鸭子会游泳。'},
  {en:'apple',      zh:'苹果',  cat:'fruit',  ex:'I eat an apple every day.',  exZh:'我每天吃一个苹果。'},
  {en:'banana',     zh:'香蕉',  cat:'fruit',  ex:'The banana is yellow.',      exZh:'香蕉是黄色的。'},
  {en:'orange',     zh:'橙子',  cat:'fruit',  ex:'This orange is very sweet.', exZh:'这个橙子很甜。'},
  {en:'pear',       zh:'梨',    cat:'fruit',  ex:'The pear is on the table.',  exZh:'梨在桌子上。'},
  {en:'grape',      zh:'葡萄',  cat:'fruit',  ex:'I like grapes.',             exZh:'我喜欢葡萄。'},
  {en:'watermelon', zh:'西瓜',  cat:'fruit',  ex:'Watermelon is good in summer.', exZh:'夏天吃西瓜真好。'},
  {en:'strawberry', zh:'草莓',  cat:'fruit',  ex:'The strawberry is red and small.', exZh:'草莓又红又小。'},
  {en:'peach',      zh:'桃子',  cat:'fruit',  ex:'The peach is soft and sweet.', exZh:'桃子又软又甜。'},
  {en:'mango',      zh:'芒果',  cat:'fruit',  ex:'My mother likes mangoes.',   exZh:'我妈妈喜欢芒果。'},
  {en:'lemon',      zh:'柠檬',  cat:'fruit',  ex:'The lemon is very sour.',    exZh:'柠檬很酸。'}
];

var filter = 'all';
var list = [];
var idx = 0;
var flipped = false;

var inner = document.getElementById('inner');
var elWordF = document.getElementById('wordF');
var elZh = document.getElementById('zh');
var elExEn = document.getElementById('exEn');
var elExZh = document.getElementById('exZh');
var elBadgeF = document.getElementById('badgeF');
var elBadgeB = document.getElementById('badgeB');
var elCount = document.getElementById('count');
var elFill = document.getElementById('fill');
var elToast = document.getElementById('toast');
var toastTimer = null;

function toast(msg){
  elToast.textContent = msg;
  elToast.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ elToast.classList.remove('show'); }, 1800);
}

function build(){
  list = WORDS.filter(function(w){ return filter === 'all' || w.cat === filter; });
  idx = 0;
  flipped = false;
  render();
}

function render(){
  var w = list[idx];
  if(!w) return;
  inner.classList.toggle('flipped', flipped);
  elWordF.textContent = w.en;
  elZh.textContent = w.zh;
  elExEn.textContent = w.ex;
  elExZh.textContent = w.exZh;
  var isFruit = w.cat === 'fruit';
  var label = isFruit ? '水果' : '动物';
  elBadgeF.textContent = label;
  elBadgeB.textContent = label;
  elBadgeF.className = 'badge' + (isFruit ? ' fruit' : '');
  elBadgeB.className = 'badge' + (isFruit ? ' fruit' : '');
  elCount.textContent = (idx + 1) + ' / ' + list.length;
  elFill.style.width = ((idx + 1) / list.length * 100) + '%';
}

function flip(){
  flipped = !flipped;
  inner.classList.toggle('flipped', flipped);
}

function step(dir){
  idx = (idx + dir + list.length) % list.length;
  flipped = false;
  render();
  if(dir > 0 && idx === 0) toast('一轮读完啦，点「打乱顺序」再来一遍');
}

function shuffle(){
  for(var i = list.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = list[i]; list[i] = list[j]; list[j] = t;
  }
  idx = 0; flipped = false;
  render();
  toast('顺序已打乱，从第 1 张开始');
}

function speak(text){
  if(!('speechSynthesis' in window)){
    toast('这台设备的浏览器不支持朗读');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){
    toast('朗读没能启动，试试把音量打开');
  }
}

document.getElementById('card').addEventListener('click', function(e){
  if(e.target.closest('.speak-ex')) return;
  flip();
});
document.getElementById('speak').addEventListener('click', function(e){
  e.stopPropagation();
  speak(list[idx].en);
});
document.getElementById('speakEx').addEventListener('click', function(e){
  e.stopPropagation();
  speak(list[idx].ex);
});
document.getElementById('prev').addEventListener('click', function(){ step(-1); });
document.getElementById('next').addEventListener('click', function(){ step(1); });
document.getElementById('shuffle').addEventListener('click', shuffle);

var tabs = document.querySelectorAll('.tab');
for(var i = 0; i < tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    for(var k = 0; k < tabs.length; k++) tabs[k].classList.remove('on');
    this.classList.add('on');
    filter = this.getAttribute('data-filter');
    build();
  });
}

document.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
  else if(e.key === 'ArrowRight') step(1);
  else if(e.key === 'ArrowLeft') step(-1);
});

build();
</script>
</body>
</html>
